name: LINE Sports AI - 30-minute auto-recovery monitor

on:
  schedule:
    # UTC minute 13 and 43: every 30 minutes, including Taiwan time.
    - cron: "13,43 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/line-bot-monitor.yml"
      - "scripts/monitor_bot.py"
      - "scripts/auto_recover_bot.py"
      - "scripts/monitor_issue.py"

permissions:
  contents: write
  issues: write

concurrency:
  group: line-sports-ai-health
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Check bot, LINE Webhook, menus, and fixture feeds
        id: health
        continue-on-error: true
        run: |
          python3 scripts/monitor_bot.py \
            --report "$RUNNER_TEMP/monitor-report.txt" \
            --diagnostics "$RUNNER_TEMP/monitor-diagnostics.json"
      - name: Auto-redeploy only restartable application faults
        id: repair
        if: steps.health.outcome != 'success'
        continue-on-error: true
        run: |
          python3 scripts/auto_recover_bot.py \
            --report "$RUNNER_TEMP/monitor-report.txt" \
            --diagnostics "$RUNNER_TEMP/monitor-diagnostics.json"
      - name: Verify health after controlled Render redeploy
        id: recheck
        if: steps.repair.outputs.redeployed == 'true'
        continue-on-error: true
        run: |
          sleep 100
          python3 scripts/monitor_bot.py \
            --report "$RUNNER_TEMP/monitor-report.txt" \
            --diagnostics "$RUNNER_TEMP/monitor-diagnostics.json"
      - name: Open or resolve a single incident
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONITOR_RESULT: ${{ steps.health.outcome == 'success' || steps.recheck.outcome == 'success' }}
          MONITOR_REPORT: ${{ runner.temp }}/monitor-report.txt
          RECOVERY_RESULT: ${{ steps.repair.outputs.redeployed }}
        run: python3 scripts/monitor_issue.py
      - name: Fail if bot is still unhealthy
        if: steps.health.outcome != 'success' && steps.recheck.outcome != 'success'
        run: exit 1
