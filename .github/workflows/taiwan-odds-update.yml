name: Taiwan Sports Lottery - manual source recovery

on:
  # Legacy official-source diagnostic: no duplicate daily automatic fetch.
  # Hourly public-page updates are handled by tw-odds-10min.yml.
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: taiwan-odds-official-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify public Taiwan Lottery page
        id: fetch
        continue-on-error: true
        run: |
          python3 scripts/update_tw_official_odds.py \
            --out app/tw_official_odds.json \
            --status "$RUNNER_TEMP/tw-odds-status.json"
      - name: Open public official page with Chrome if HTTP download failed
        id: browser
        if: steps.fetch.outcome != 'success'
        continue-on-error: true
        run: |
          python3 -m pip install --disable-pip-version-check "playwright>=1.55,<2"
          python3 -m scripts.tw_browser_capture \
            --out app/tw_official_odds.json \
            --status "$RUNNER_TEMP/tw-odds-status.json"
      - name: Read third-party Taiwan lottery odds references if official site is blocked
        id: thirdparty
        if: steps.fetch.outcome != 'success' && steps.browser.outcome != 'success'
        continue-on-error: true
        run: |
          python3 -m scripts.tw_playsport_fallback \
            --out app/tw_third_party_odds.json \
            --status "$RUNNER_TEMP/tw-third-party-status.json"
      - name: Save source-labeled verified odds and sync to bot
        id: push
        if: steps.fetch.outcome == 'success' || steps.browser.outcome == 'success' || steps.thirdparty.outcome == 'success'
        continue-on-error: true
        run: |
          git add -A -- app/tw_official_odds.json
          if [ -f app/tw_third_party_odds.json ]; then
            git add -A -- app/tw_third_party_odds.json
          fi
          if git diff --cached --quiet; then
            echo "Verified odds unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update published Taiwan lottery reference odds (source labeled)"
            git push origin HEAD:main
          fi
      - name: Report source failures or recovery
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FETCH_OUTCOME: ${{ (steps.fetch.outcome == 'success' || steps.browser.outcome == 'success') && 'success' || 'failure' }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          TW_STATUS_PATH: ${{ runner.temp }}/tw-odds-status.json
        run: python3 scripts/tw_odds_issue.py
      - name: Mark missing verified data as failed
        if: (steps.fetch.outcome != 'success' && steps.browser.outcome != 'success' && steps.thirdparty.outcome != 'success') || steps.push.outcome != 'success'
        run: exit 1
