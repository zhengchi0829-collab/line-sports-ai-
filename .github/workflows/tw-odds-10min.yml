name: Taiwan Odds - hourly public page refresh (no redeploy)

on:
  schedule:
    # Every hour, Taiwan UTC+8. GitHub may start scheduled runs late.
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tw-odds-10min.yml"
      - "scripts/tw_playsport_fallback.py"

permissions:
  contents: write

concurrency:
  group: taiwan-odds-hourly-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read third-party public sports-odds reference and validate source
        run: |
          python3 -m scripts.tw_playsport_fallback \
            --out "$RUNNER_TEMP/tw_third_party_odds.json" \
            --status "$RUNNER_TEMP/tw_hourly_status.json"
      - name: Update independent odds-data branch without restarting Render
        run: |
          set -eu
          cp "$RUNNER_TEMP/tw_third_party_odds.json" "$RUNNER_TEMP/latest-odds.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin odds-cache >/dev/null 2>&1; then
            git fetch --no-tags origin odds-cache
            git checkout -B odds-cache FETCH_HEAD
          else
            git checkout --orphan odds-cache
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          cp "$RUNNER_TEMP/latest-odds.json" tw_third_party_odds.json
          git add -f tw_third_party_odds.json
          if git diff --cached --quiet; then
            echo "Hourly odds checked; snapshot unchanged"
          else
            git commit -m "Update Taiwan odds reference (hourly page check)"
            git push origin HEAD:refs/heads/odds-cache
          fi
